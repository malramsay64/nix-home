[language-server]
typos-lsp = { command = "typos-lsp" }
pyrefly = { command = "pyrefly", args = ["lsp"] }
dbt-language-server = { command = "dbt-language-server" }
sqls = { command = "sqls" }
tinymist = { command = "tinymist" }
ty = { command = "ty" }
zizmor = { command = "zizmor", args = ["--lsp"] }

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]
[language-server.basedpyright.config]
basedpyright.analysis.diagnosticMode = "openFilesOnly"

[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
auto-format = true
formatter = { command = "taplo", args = ["format", "-"] }
language-servers = ["taplo", "typos-lsp"]

[[language]]
name = "yaml"
scope = "source.yaml"
file-types = ["yaml", "yml"]
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }
language-servers = ["yaml-language-server"]

[[language]]
name = "github-action"
scope = "source.yaml"
file-types = [{ glob = ".github/workflows/*.{yml,yaml}" }]
language-servers = ["yaml-language-server", "zizmor"]

[[language]]
name = "json"
scope = "source.json"
file-types = ["json"]
formatter = { command = 'prettier', args = ["--parser", "json"] }

[[language]]
name = "typst"
scope = "source.typst"
file-types = ["typ"]
auto-format = true
# formatter = { command = "typstfmt", args = ["--output", "-"] }
language-servers = ["tinymist", "typos-lsp"]

[[language]]
name = "markdown"
scope = "source.md"
file-types = ["md", "markdown"]
language-servers = ["marksman", "typos-lsp"]

[[language]]
name = "rust"
scope = "source.rust"
file-types = ["rs"]
auto-format = true
language-servers = ["rust-analyzer", "typos-lsp"]

[[language]]
name = "sql"
scope = "source.sql"
file-types = ["sql"]
file-types = ["sql"]
auto-format = true
formatter = { command = "sqlfmt", args = ["-"] }

[[language]]
name = "python"
scope = "source.python"
file-types = ["py", "pyi"]
auto-format = true
language-servers = ["ty", "ruff", "typos-lsp"]
